# ParkourArea 全局配置
# 重载命令: /parkour reload

# 配置文件版本（请勿手改）。数据目录中的版本低于 jar 内置版本时，启动/重载会在控制台
# 与游戏内警告；可用 /parkour updateconf 合并新增配置项，或 /parkour recreateconf 重建
config-version: 2

settings:
  # 区域/方块/存档点检测周期（单位 tick，20tick=1秒）。默认 1 = 每 tick 检测刷新（起点/终点/计时器等）。
  # 玩家极多时为降低 global region 单线程开销可调大（如 2）。
  detect-interval-ticks: 1
  # actionbar 渲染周期（tick）。默认 1 = 每 tick 刷新计时器显示。
  actionbar-interval-ticks: 1
  # 防挂机：同一位置无移动或视角晃动超过该秒数则作废成绩并传回大厅
  anti-idle-seconds: 60
  # 防挂机：视角变化低于该角度（度）视为未晃动
  anti-idle-rotation-threshold-deg: 5.0
  # 每关记录的前 N 次通关用时（循环覆盖最旧）
  top-record-count: 10
  # 标记跑酷玩家所需的允许游戏模式
  require-gamemode:
    - SURVIVAL
    - ADVENTURE
  # 中途存档点触发的方块（玩家脚下方块）
  checkpoint-block: GOLD_BLOCK
  # 记录存档点成功时播放的音效（仅播放一次）
  checkpoint-success-sound: entity.player.levelup
  # 是否启用存档点音效（可通过命令切换）
  checkpoint-sound-enabled: true
  # 所有跑酷音效总开关默认值（玩家可用工具切换；总开关关闭则所有跑酷音效静音）
  sound-enabled: true
  # 效果块（踩方块）音效默认值（玩家可用 /parkour sound block 切换）
  block-sound-enabled: true
  # 玩家在关卡区域对其他玩家的默认可见性挡位（FULL/HALF/TENTH/HIDDEN）
  default-visibility-mode: FULL
  # 评级 >tier3 时每多少毫秒交替闪烁一次
  rating-flicker-interval-millis: 500
  # 传送朝向：true = 区域 spawn 未手动指定 yaw/pitch 的字段保留玩家当前朝向；
  # false = 未指定字段回落 0/0（正南平视）
  teleport-keep-rotation: true

# 默认编辑模式状态（启动时全局编辑模式开关）
edit-mode-default: false

# 调试日志（开发用，生产关闭）
debug: false
