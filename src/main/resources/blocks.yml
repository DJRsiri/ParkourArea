# 配置文件版本（请勿手改）：见 config.yml 的 config-version 说明
blocks-version: 2

# 方块踩踏命令配置
# 当玩家踩在指定方块（脚下方块，y-0.1 检测）上时执行
# 支持变量: %player% 玩家名, 以及 PlaceholderAPI 变量 (需安装 PAPI)
# command/sound 填 [] 表示禁用此项
# repeat: true 时按 interval（tick）重复触发
# 命令静默执行（无反馈刷屏）；执行前自动清除玩家受伤冷却，
# /damage 类命令不会被受伤无敌帧吞掉
#
# 方块名使用 Bukkit Material 名称（小写）

blocks:
  sea_lantern:
    command:
      - "damage %player% 1"
    sound:
      - "block.lava.pop"
    repeat: true
    interval: 10

  # 示例：踩到岩浆块持续扣血 + 音效
